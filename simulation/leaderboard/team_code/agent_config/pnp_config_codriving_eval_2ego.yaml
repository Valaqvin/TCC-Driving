# CoDriving baseline for the bargaining closed-loop comparison.
# It matches the bargaining config in ego count, planner config, planner
# checkpoint, perception checkpoint, route protocol, and controller settings.
# The only intentional difference is that no bargaining action module is used.

control:
    turn_KP: 1.0
    turn_KI: 0.2
    turn_KD: 0.1
    turn_n: 5

    speed_KP: 5.0
    speed_KI: 1
    speed_KD: 0.1
    speed_n: 20

    max_throttle: 0.75
    brake_speed: 0.1
    brake_ratio: 1.1
    clip_delta: 0.35
    max_speed: 5
    collision_buffer: [2.5, 1.2]
    momentum: 0
    target_point_distance: 10
    detect_threshold: &det_thre  0.04

RSU:
    change_rsu_frame: 5
    rsu_height: 7.5
    rsu_lane_side: 'right'
    rsu_distance: 12

simulation:
    ego_num: 2
    skip_frames: 4

perception:
    core_method: 'collaborative_perception'
    detect_threshold: *det_thre
    detection_range: [36, 12, 12, 12]
    perception_model_dir: 'ckpt/codriving/perception'

planning:
    core_method: 'MotionNet'
    planner_config: "codriving/hypes_yaml/codriving/end2end_covlm_cmd_extend_adaptive_20.yaml"
    planner_model_checkpoint: 'ckpt/codriving/planning/epoch_26.ckpt'
